[project]
name = "StarForge-AI"
version = "1.0.0"
description = "模块化、单一职责的端到端 AI 应用平台"
authors = [{ name = "晨星" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
optional = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "pypdf>=4.0",
    "prometheus-client>=0.19",
]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
starforge = "starforge.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["starforge*"]
